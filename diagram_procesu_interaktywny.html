<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<title>Diagram procesu produkcji — e-medycyna.pl</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f5f7;
    min-height: 100vh;
    padding: 24px 16px 48px;
  }

  .page-header {
    max-width: 860px;
    margin: 0 auto 20px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .page-header h1 {
    font-size: 20px;
    font-weight: 700;
    color: #1a1a1a;
  }
  .page-header span {
    font-size: 12px;
    color: #888;
  }

  .diagram-wrap {
    max-width: 860px;
    margin: 0 auto;
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.10);
    padding: 20px;
  }

  svg { display: block; width: 100%; height: auto; }

  /* klikalne bloki */
  .clickable { cursor: pointer; transition: filter 0.15s; }
  .clickable:hover rect, .clickable:hover { filter: brightness(0.93); }
  .clickable rect { transition: filter 0.15s; }

  /* MODAL */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .overlay.active { display: flex; }

  .modal {
    background: white;
    border-radius: 12px;
    padding: 28px 32px;
    max-width: 480px;
    width: 90%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    position: relative;
    animation: popIn 0.18s ease;
  }
  @keyframes popIn {
    from { transform: scale(0.92); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }

  .modal-close {
    position: absolute;
    top: 14px; right: 18px;
    font-size: 22px;
    cursor: pointer;
    color: #999;
    line-height: 1;
    border: none;
    background: none;
  }
  .modal-close:hover { color: #333; }

  .modal-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .modal h2 {
    font-size: 17px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 6px;
  }
  .modal .step-label {
    font-size: 11px;
    color: #888;
    margin-bottom: 14px;
  }
  .modal ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .modal ul li {
    font-size: 13.5px;
    color: #333;
    padding-left: 18px;
    position: relative;
    line-height: 1.5;
  }
  .modal ul li::before {
    content: "→";
    position: absolute;
    left: 0;
    color: #aaa;
    font-size: 12px;
  }

  .hint {
    text-align: center;
    font-size: 11.5px;
    color: #aaa;
    margin-top: 14px;
    letter-spacing: 0.02em;
  }
</style>
</head>

function show(id) {
  const d = data[id];
  if (!d) return;
  document.getElementById('modal-badge').textContent = d.badge;
  document.getElementById('modal-badge').style.background = d.badgeColor;
  document.getElementById('modal-badge').style.color = d.badgeText;
  document.getElementById('modal-badge').style.border = '1px solid ' + d.badgeText;
  document.getElementById('modal-step').textContent = d.step;
  document.getElementById('modal-step').style.cssText = 'font-size:11px;color:#888;margin-bottom:8px;';
  document.getElementById('modal-title').textContent = d.title;
  const ul = document.getElementById('modal-list');
  ul.innerHTML = d.items.map(i => `<li>${i}</li>`).join('');
  document.getElementById('overlay').classList.add('active');
}

function hide() {
  document.getElementById('overlay').classList.remove('active');
}

function closeIfBg(e) {
  if (e.target === document.getElementById('overlay')) hide();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });
